<div class="m-8 bg-white" [formGroup]="form()">
    <div class="mb-8">
        <h1 class="text-2xl font-semibold text-gray-800 mb-2">1. Informações básicas</h1>
        <p class="text-gray-600">Adicione as principais informações do evento.</p>
    </div>
    <div class="mb-6">
        <label for="eventName" class="block text-gray-700 text-sm font-bold mb-2">
            Nome do evento <span class="text-red-500">*</span>
        </label>
        <input type="text" id="eventName" formControlName="name" required placeholder="Nome do evento"
            class="shadow appearance-none border rounded w-3/4 py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline focus:border-blue-500">
        @if (name?.invalid && (name?.dirty || name?.touched)) {
        <div class="text-red-500 text-xs mt-1">
            @if (name?.hasError('required')) {
            <span>Nome do evento é obrigatório.</span>
            }
            @if (name?.hasError('maxlength')) {
            <span>Máximo de 100 caracteres.</span>
            }
        </div>
        }
    </div>

    <div class="flex flex-col">
        <label for="category">Categoria <span class="text-red-500">*</span></label>
        <select id="category" formControlName="eventCategory" required class="block appearance-none w-full bg-white border border-gray-300 text-gray-700 py-2 px-3 pr-8 rounded leading-tight focus:outline-none
            focus:shadow-outline focus:border-blue-500">
            <option value="" disabled>Selecione uma categoria</option>
            @for (categories of categories; track categories) {
            <option [value]="categories">{{categories}}</option>
            }
        </select>
    </div>
</div>
