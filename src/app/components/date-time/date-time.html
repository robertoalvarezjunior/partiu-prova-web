<div class="m-8 bg-white">
    <form action="">
        <div>
            <h1>2. Data e horário</h1>
            <p>Informe aos participantes a data e horário do evento.</p>
        </div>
        <div class="grid grid-cols-4 gap-4">
            <div class="flex flex-col">
                <label for="initialDate">Data de Início <span>*</span></label>
                <input type="date" name="initialDate" id="initialDate" class="">
            </div>
            <div class="flex flex-col">
                <label for="initialTime">Hora de Início <span>*</span></label>
                <input type="time" name="initialTime" id="initialTime" class="">
            </div>
            <div class="flex flex-col">
                <label for="finalDate">Data de Término <span>*</span></label>
                <input type="date" name="finalDate" id="finalDate" class="">
            </div>
            <div class="flex flex-col">
                <label for="finalTime">Hora de Término <span>*</span></label>
                <input type="time" name="finalTime" id="finalTime" class="">
            </div>

        </div>
    </form>
</div>
