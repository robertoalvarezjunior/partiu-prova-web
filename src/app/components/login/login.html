<main class="min-h-screen flex items-center justify-center body px-4">
  <div class="max-w-md w-full space-y-8 p-8 rounded-2xl shadow-xl bg-white">
    <div class="text-center">
      <h2 class="mt-6 text-3xl font-extrabold text-gray-900">Bem-vindo de volta!</h2>
    </div>
    <button
      type="button"
      (click)="loginWithGoogle()"
      [disabled]="isLoadingGoogle() || isLoading()"
      class="w-full flex items-center justify-center gap-3 px-4 py-3 border border-gray-300 rounded-lg bg-white text-gray-700 font-medium hover:bg-gray-50 transition-colors shadow-sm disabled:opacity-50"
    >
      <img
        src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg"
        alt="Google Logo"
        class="w-5 h-5"
      />
      @if (isLoadingGoogle()) {
      <span>Conectando...</span>
      } @else { Continuar com o Google }
    </button>
    <div class="relative py-2">
      <div class="absolute inset-0 flex items-center">
        <span class="w-full border-t border-gray-200"></span>
      </div>
      <div class="relative flex justify-center text-xs uppercase">
        <span class="bg-white px-2 text-gray-500">Ou use seu e-mail</span>
      </div>
    </div>
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="mt-8 space-y-6">
      <div class="space-y-4">
        <div>
          <label for="email" class="block text-sm font-medium text-gray-700">E-mail</label>
          <input
            id="email"
            type="email"
            formControlName="email"
            class="mt-1 block w-full px-4 py-3 rounded-lg border border-gray-300 bg-white text-gray-900 focus:ring-2 focus:ring-brand-yellow focus:border-transparent outline-none transition-all"
            placeholder="exemplo@email.com"
          />
        </div>
        <div>
          <div class="flex justify-between items-center">
            <label for="password" class="block text-sm font-medium text-gray-700">Senha</label>
            <a href="#" class="text-xs text-brand-yellow hover:underline">Esqueceu a senha?</a>
          </div>
          <input
            id="password"
            type="password"
            formControlName="password"
            class="mt-1 block w-full px-4 py-3 rounded-lg border border-gray-300 bg-white text-gray-900 focus:ring-2 focus:ring-brand-yellow focus:border-transparent outline-none transition-all"
            placeholder="••••••••"
          />
        </div>
      </div>

      <button
        type="submit"
        [disabled]="loginForm.invalid || isLoading()"
        class="group relative w-full flex justify-center py-3 px-4 border border-transparent text-sm font-bold rounded-lg bg-yellow-400 text-black bg-brand-yellow hover:bg-yellow-500 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-brand-yellow transition-all disabled:opacity-50 disabled:cursor-not-allowed disabled:bg-gray-200"
      >
        @if (isLoading()) {
        <span class="animate-pulse">Autenticando...</span>
        } @else { ENTRAR NA CONTA }
      </button>
    </form>

    <!-- <p class="text-center text-sm text-gray-900">
      Não tem uma conta?
      <a routerLink="/register" class="font-bold text-brand-yellow hover:underline"
        >Cadastre-se grátis</a
      >
    </p> -->
  </div>
</main>
