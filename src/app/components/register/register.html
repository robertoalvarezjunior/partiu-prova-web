<div class="flex items-center justify-center min-h-screen bg-gray-100">
  <div class="w-full max-w-md p-8 space-y-6 bg-white rounded-lg shadow-md">
    <h2 class="text-3xl font-bold text-center text-gray-900">Crie sua conta</h2>
    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="space-y-6">
      <div>
        <label for="name" class="text-sm font-medium text-gray-700">Nome</label>
        <input
          id="name"
          type="text"
          formControlName="name"
          required
          class="w-full px-3 py-2 mt-1 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500"
        />
      </div>
      <div>
        <label for="email" class="text-sm font-medium text-gray-700">Email</label>
        <input
          id="email"
          type="email"
          formControlName="email"
          required
          class="w-full px-3 py-2 mt-1 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500"
        />
      </div>
      <div>
        <label for="password" class="text-sm font-medium text-gray-700">Senha</label>
        <input
          id="password"
          type="password"
          formControlName="password"
          required
          class="w-full px-3 py-2 mt-1 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500"
        />
      </div>
      <div>
        <label for="confirm-password" class="text-sm font-medium text-gray-700"
          >Confirme a senha</label
        >
        <input
          id="confirm-password"
          type="password"
          formControlName="confirmPassword"
          required
          class="w-full px-3 py-2 mt-1 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500"
        />
      </div>
      <div>
        <button
          type="submit"
          class="w-full px-4 py-2 font-medium text-white bg-indigo-600 rounded-md hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500"
        >
          Criar conta
        </button>
      </div>
    </form>
    <p class="text-sm text-center text-gray-600">
      Já tem uma conta?
      <a routerLink="/login" class="font-medium text-indigo-600 hover:text-indigo-500"
        >Faça login</a
      >
    </p>
  </div>
</div>
