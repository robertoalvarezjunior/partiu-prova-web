<header class="header">
  <div class="header__container">
    <div class="logo-container">
      <a class="logo-container__logo" routerLink="/"
        ><img ngSrc="assets/images/logo.png" width="367" height="125" priority alt="Partiu Prova"
      /></a>
    </div>

    <nav class="nav-main" aria-label="Navegação principal">
      <a routerLink="/" routerLinkActive="active-link" [routerLinkActiveOptions]="{ exact: true }"
        >Início</a
      >
      <a routerLink="/events" routerLinkActive="active-link">Eventos</a>
      @if (auth.isAuthenticated()) {
      <a routerLink="/my-tickets" routerLinkActive="active-link">Meus Ingressos</a>
      }
    </nav>
    <div class="nav-auth">
      @if (auth.isAuthenticated()) {
      <div class="user-menu">
        <button class="avatar-button" (click)="toggleMenu()">
          <span class="avatar-initial">{{ userInitial() }}</span>
        </button>
        @if (isMenuOpen()) {
        <div class="menu">
          <a routerLink="/profile" (click)="closeMenu()">Ver perfil</a>
          <button (click)="signOut()">Sair</button>
        </div>
        }
      </div>
      } @else {
      <button ui-button size="md" variant="tertiary" routerLink="/login">Entrar</button>
      <button ui-button size="md" routerLink="/sign-up">Cadastrar</button>
      }
    </div>
    <button type="button" class="menu-hamburguer" (click)="toggleMenu()"><span></span></button>
    @if (isMenuOpen()) {
    <div class="mobile-overlay">
      <nav class="nav-mobile">
        <a routerLink="/" routerLinkActive="active-link" [routerLinkActiveOptions]="{ exact: true }"
          >Início</a
        >
        <a routerLink="/events" routerLinkActive="active-link">Eventos</a>
        @if (auth.isAuthenticated()) {
        <a routerLink="/my-tickets" routerLinkActive="active-link">Meus Ingressos</a>
        } @if (!auth.isAuthenticated()) {
        <hr />
        <button ui-button variant="secondary" routerLink="/login">Entrar</button>
        <button ui-button routerLink="/sign-up">Cadastrar-se</button>
        }
      </nav>
    </div>
    }
  </div>
</header>
