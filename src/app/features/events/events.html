<main class="main">
  <div class="content">
    <div class="content__title">
      <h1>TODOS OS EVENTOS</h1>
      <p>Encontre a prova perfeita para você</p>
    </div>
    <div class="content__form">
      <input
        type="text"
        class="content__input"
        placeholder="Digite sua busca"
        [(ngModel)]="searchTerm"
        name="search"
        autocomplete="on"
        (keyup)="updateTimer()"
      />
      <div class="content__buttons">
        @if (!selectedCategory()) {
        <button ui-button type="button" (click)="onCategorySelected()">Todos</button>
        }@else {
        <button ui-button type="button" variant="secondary" (click)="onCategorySelected()">
          Todos
        </button>
        } @for (cat of categories(); track cat.id) { @if (cat === selectedCategory()) {
        <button ui-button type="button" (click)="onCategorySelected(cat)">
          {{ cat.name }}
        </button>
        }@else {
        <button ui-button type="button" variant="secondary" (click)="onCategorySelected(cat)">
          {{ cat.name }}
        </button>
        } }
      </div>
    </div>
    <div class="events">
      @for (event of events(); track event.id) {
      <app-ui-card-event
        [title]="event.title"
        [date]="event.starts_at"
        [local]="event.local"
        [category]="event.category.name"
        [btn]="navigateTo('/event', event.id)"
      />
      }
    </div>
  </div>
</main>
