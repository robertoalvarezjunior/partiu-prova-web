<main class="main">
  <div class="content">
    <div class="content__title">
      <h1>TODOS OS EVENTOS</h1>
      <p>Encontre a prova perfeita para você</p>
    </div>
    <div class="content__form">
      <input
        type="text"
        class="content__input"
        placeholder="Digite sua busca"
        [(ngModel)]="searchTerm"
        name="search"
        autocomplete="on"
        (keyup)="updateTimer()"
      />
      <div class="content__buttons">
        <button type="button"><app-icon name="calendar_today" />Selecione uma Data</button>
        <button type="button">
          Selecione uma Categoria<app-icon name="keyboard_arrow_down" />
        </button>
      </div>
    </div>
    <div class="events">
      @for (event of events(); track event.id) {
      <app-ui-card-event
        [title]="event.title"
        [date]="event.starts_at"
        [local]="event.local"
        [category]="event.category.name"
      />
      }
    </div>
  </div>
</main>
