<article class="event-card">
  <div class="event-card__header">
    <img src="assets/images/logo.png" alt="Título do Evento" class="event-card__image" />
    <span class="event-card__badge">{{ category() }}</span>
  </div>

  <div class="event-card__body event-card__info-list">
    <h3 class="event-card__title">{{ title() }}</h3>
    <div class="event-card__info-item">
      <app-icon name="calendar_today" aria-label="Data do Evento" />
      <p>{{ dateFormat() }}</p>
    </div>
    <div class="event-card__info-item">
      <app-icon name="location_on" aria-label="Localização do Evento" />
      <p class="u-line-clamp-1">{{ local() }}</p>
    </div>
    <button ui-button type="button" [routerLink]="btn()">Ver Detalhes</button>
  </div>
</article>
